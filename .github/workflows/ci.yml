name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Install Chromium for the headless render oracle
        run: playwright install --with-deps chromium

      - name: Run the test suite
        run: python3 -m pytest -q

      - name: Repository hygiene (no operator data, no codenames)
        run: bash scripts/check-repo-hygiene.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # --severity=error fails on real breakage (bad syntax, undefined behavior) and stays
      # quiet about style preferences. Tighten to warning once the tree is warning-clean.
      - name: Lint shell scripts
        run: shellcheck --severity=error scripts/*.sh */scripts/*.sh
