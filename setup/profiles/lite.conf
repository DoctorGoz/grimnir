# GRIMNIR Lite Profile — Drop box, recon-only
# Target: Raspberry Pi (2-4GB RAM), minimal VPS, containers
# Agents: Hunter (recon phases only)

PROFILE_NAME="lite"
PROFILE_DESC="Lightweight recon and enumeration — drop box / field kit"
MIN_RAM_MB=2048
AGENTS="hunter"

# Tool categories to install
INSTALL_RECON=true
INSTALL_ENUMERATION=true
INSTALL_VULN_SCANNING=true
INSTALL_EXPLOITATION=false
INSTALL_WEB_TESTING=false
INSTALL_AI_TESTING=false
INSTALL_CREDENTIAL_ATTACKS=false
INSTALL_METASPLOIT=false
INSTALL_POSTGRESQL=false

# Resource tuning
NUCLEI_CONCURRENCY=10
NMAP_TIMING=3
MAX_PARALLEL_SCANS=2
FFUF_THREADS=20

# Core packages (apt)
APT_PACKAGES=(
    nmap
    masscan
    whatweb
    wafw00f
    dnsrecon
    dnsx
    nikto
    curl
    wget
    jq
    openssl
    ncat
    net-tools
    whois
    traceroute
)

# Go tools
GO_TOOLS=(
    "github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest"
    "github.com/projectdiscovery/httpx/cmd/httpx@latest"
    "github.com/projectdiscovery/naabu/v2/cmd/naabu@latest"
    "github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest"
    "github.com/projectdiscovery/dnsx/cmd/dnsx@latest"
)

# Python packages (venv)
PIP_PACKAGES=()

# Optional heavyweight tools
OPTIONAL_TOOLS=()
