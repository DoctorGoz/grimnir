# GRIMNIR Full Profile — All agents
# Target: Kali workstation (8GB+ RAM), beefy VPS, Pi 5 (8GB)
# Agents: Hunter, Specter, ARTEMIS, Nimbus (cloud), Nomad (mobile)

PROFILE_NAME="full"
PROFILE_DESC="Complete GRIMNIR deployment — all specialist agents"
MIN_RAM_MB=8192
AGENTS="hunter specter artemis nimbus nomad"

# Tool categories to install
INSTALL_RECON=true
INSTALL_ENUMERATION=true
INSTALL_VULN_SCANNING=true
INSTALL_EXPLOITATION=true
INSTALL_WEB_TESTING=true
INSTALL_AI_TESTING=true
INSTALL_CLOUD_TESTING=true
INSTALL_MOBILE_TESTING=true
INSTALL_CREDENTIAL_ATTACKS=true
INSTALL_METASPLOIT=true
INSTALL_POSTGRESQL=true

# Resource tuning
NUCLEI_CONCURRENCY=50
NMAP_TIMING=4
MAX_PARALLEL_SCANS=8
FFUF_THREADS=80

# Core packages (apt)
APT_PACKAGES=(
    # Network/Infra
    nmap
    masscan
    whatweb
    wafw00f
    dnsrecon
    nikto
    enum4linux
    smbclient
    hydra
    netexec
    evil-winrm
    exploitdb
    # Web/API
    ffuf
    gobuster
    feroxbuster
    sqlmap
    commix
    arjun
    wapiti
    dirb
    graphqlmap
    # SAST/Secrets
    trufflehog
    gitleaks
    # CMS
    wpscan
    # Auth/JWT
    # Proxy
    zaproxy
    mitmproxy
    # Support
    curl
    wget
    jq
    gron
    openssl
    ncat
    net-tools
    whois
    python3-venv
    python3-pip
    git
    nodejs
    npm
    ruby
    ruby-dev
)

# Go tools
GO_TOOLS=(
    "github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest"
    "github.com/projectdiscovery/httpx/cmd/httpx@latest"
    "github.com/projectdiscovery/naabu/v2/cmd/naabu@latest"
    "github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest"
    "github.com/projectdiscovery/dnsx/cmd/dnsx@latest"
    "github.com/projectdiscovery/katana/cmd/katana@latest"
    "github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest"
    "github.com/hahwul/dalfox/v2@latest"
    "github.com/tomnomnom/gf@latest"
    "github.com/tomnomnom/anew@latest"
    "github.com/tomnomnom/gron@latest"
    "github.com/tomnomnom/qsreplace@latest"
    "github.com/lc/gau/v2/cmd/gau@latest"
    "github.com/tomnomnom/waybackurls@latest"
    "github.com/assetnote/kiterunner/cmd/kr@latest"
)

# Python packages (venv)
PIP_PACKAGES=(
    uro
    paramspider
    semgrep
    bandit
)

# Optional heavyweight tools (prompted during install)
OPTIONAL_TOOLS=(
    nessus
    burpsuite
    caido
)
